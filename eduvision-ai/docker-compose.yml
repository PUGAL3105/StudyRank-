# ==============================================================================
# EduVision AI — Multi-Container Local & Staging Orchestration
# ==============================================================================

version: '3.8'

services:
  # ── 1. PostgreSQL with pgvector Extension ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eduvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eduvision_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduvision_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduvision-network

  # ── 2. Node.js / Express Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduvision-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-eduvision_ai}?sslmode=prefer
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eduvision_ai}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-eduvision_super_secure_jwt_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: 1536
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data/textbooks:/app/data/textbooks:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - eduvision-network

  # ── 3. React / Nginx Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: eduvision-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - eduvision-network

volumes:
  postgres_data:
    driver: local

networks:
  eduvision-network:
    driver: bridge
