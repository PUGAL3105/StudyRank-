name: EduVision AI — Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. CI TEST & BUILD VALIDATION
  # ────────────────────────────────────────────────────────────────────────────
  test-and-build:
    name: 🧪 Test & Build (Frontend & Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eduvision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend CI
      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: 🔨 Build Backend (TypeScript)
        working-directory: backend
        run: npm run build

      # Frontend CI
      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Build Frontend (Vite & TypeScript)
        working-directory: frontend
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # 2. DOCKER BUILD & CONTAINER VALIDATION
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Container Build & Verify
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: eduvision-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: eduvision-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 3. CD AUTOMATED CLOUD DEPLOYMENT (On Push to Main)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: 🚀 Cloud Production Deployment
    needs: [test-and-build, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Deploy to Production Server via SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST >> ~/.ssh/known_hosts

          ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            set -e
            cd /var/www/eduvision-ai || cd ~/eduvision-ai
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker system prune -f
          EOF
